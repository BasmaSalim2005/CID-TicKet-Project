<div class="dialog-title-row">
  <h2 mat-dialog-title>User Rating Details</h2>
  <button mat-icon-button class="close-btn" (click)="dialogRef.close()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>
<mat-dialog-content>
  <div><strong>User:</strong> {{ data.user || data.email }}</div>
  <div><strong>Overall Rating:</strong>
    <span class="star-rating">
      <ng-container *ngFor="let star of [1,2,3,4,5]">
        <ng-container *ngIf="(data.overallRating || data.rating) >= star; else emptyStar">&#9733;</ng-container>
        <ng-template #emptyStar>&#9734;</ng-template>
      </ng-container>
    </span>
    <span style="margin-left:8px; color:#333; font-size:15px;">{{ data.overallRating || data.rating }}/5</span>
  </div>
  <div *ngIf="data.comment"><strong>Comment:</strong> {{ data.comment }}</div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
