<p>Give Your Feedback!</p>
<app-sidebar
  [sidebarCollapsed]="sidebarCollapsed"
  (applicationNav)="navigateToApplication()"
  (featureNav)="navigateToFeature()"
  (ticketNav)="navigateToTicket()"
  (feedbackNav)="navigateToFeedback()"
></app-sidebar>

<app-header (toggleSidebar)="toggleSidebar()"></app-header>

<div style="position: absolute; top: 12%; right: 0%; width: 81% !important;">
  <table class="apps-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>State</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let app of applications">
        <td>{{ capitalizeText(app.name) }}</td>
        <td>
          <span [ngClass]="{
            'state-active': app.state === 'ACTIVE',
            'state-maintenance': app.state === 'INMAINTENANCE',
            'state-disactive': app.state === 'DISACTIVE'
          }">
            {{ app.state }}
          </span>
        </td>
        <td>{{ capitalizeText(app.description) }}</td>
        <td>
          <button mat-icon-button color="primary" (click)="openrateAppDialog(app)">
            <mat-icon>add_reaction</mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination-controls">
    <button mat-raised-button (click)="previousPage()" [disabled]="currentPage === 0">
      ← Previous
    </button>
    <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
    <button mat-raised-button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">
      Next →
    </button>
  </div>
</div>
