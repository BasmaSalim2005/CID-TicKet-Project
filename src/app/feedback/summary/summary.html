<app-sidebar
  [sidebarCollapsed]="sidebarCollapsed"
  (toggleSidebar)="toggleSidebar()"
></app-sidebar>

<app-header (toggleSidebar)="toggleSidebar()"></app-header>
<div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
  <h2>Feedback Summary for {{ appName }}</h2>
  <table class="styled-ticket-table" *ngIf="feedbacks && feedbacks.length; else noFeedback">
    <thead>
      <tr>
        <th>User</th>
        <th>Rated At</th>
        <th>Overall Rating</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let feedback of feedbacks">
        <td>{{ feedback.user || feedback.email }}</td>
        <td>{{ feedback.creationDate | date:'medium' }}</td>
        <td>
          <a style="cursor:pointer; color:#1976d2; text-decoration:underline" (click)="openRatingDialog(feedback)">
            {{ feedback.overallRating || feedback.rating }}
          </a>
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #noFeedback>
    <p>No feedback available for this application.</p>
  </ng-template>
</div>
