<app-sidebar
  [sidebarCollapsed]="sidebarCollapsed"
  (toggleSidebar)="toggleSidebar()"
></app-sidebar>

<app-header (toggleSidebar)="toggleSidebar()"></app-header>
<div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
  <h2>All Applications Feedback</h2>
  <table class="feedback-table" style="width:90%;margin:32px auto 0 auto;">
    <thead>
      <tr>
        <th style="text-align:right;">#</th>
        <th>Application Name</th>
        <th>Created At</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let app of applications; let i = index">
        <td style="text-align:right; font-weight:600;">{{ i + 1 }}</td>
        <td>
          <span class="tofeat" style="color:#1976d2; text-decoration:underline; cursor:pointer;" (click)="goToSummary(app)">
            {{ app.name }}
          </span>
        </td>
        <td>{{ app.createdAt | date:'mediumDate' }}</td>
        <td>{{ app.ratingCount }}</td>
      </tr>
    </tbody>
  </table>
</div>
