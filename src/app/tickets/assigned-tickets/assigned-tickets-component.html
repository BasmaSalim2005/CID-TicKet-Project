<mat-card>
  <h2>Assigned Tickets</h2>
  <table mat-table [dataSource]="assignedTickets" class="mat-elevation-z8">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let ticket">
        <a (click)="openTicket(ticket)" style="cursor:pointer">{{ ticket.title }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let ticket"> {{ ticket.status }} </td>
    </ng-container>
    <ng-container matColumnDef="solution">
      <th mat-header-cell *matHeaderCellDef> Solution </th>
      <td mat-cell *matCellDef="let ticket">
        <button mat-button *ngIf="!ticket.solution" (click)="addSolution(ticket)">Add Solution</button>
        <span *ngIf="ticket.solution">{{ ticket.solution }}</span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['title', 'status', 'solution']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['title', 'status', 'solution'];"></tr>
  </table>
</mat-card>
