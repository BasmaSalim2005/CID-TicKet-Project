<app-sidebar
  [sidebarCollapsed]="sidebarCollapsed"
  (toggleSidebar)="toggleSidebar()"
></app-sidebar>
<app-header (toggleSidebar)="toggleSidebar()"></app-header>
<div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed" style="top: 40px;">
  <h2>Closed Tickets</h2>
  <table class="styled-ticket-table" *ngIf="closedTickets && closedTickets.length; else noClosed">
    <thead>
      <tr>
        <th>Title</th>
        <th>Creation Date</th>
        <th>Assigned To</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tic of closedTickets">
        <td>
          <a (click)="goToTicketDetails(tic)" style="cursor:pointer; color:#1976d2; text-decoration:underline">{{ tic.title }}</a>
        </td>
        <td>{{ tic.creationDate | date:'medium' }}</td>
        <td>{{ tic.assignedTo }}</td>
        <td>{{ tic.status }}</td>
        <td>{{ tic.priority }}</td>
        <td>{{ tic.category }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noClosed>
    <p style="color: red;">No closed tickets found.</p>
  </ng-template>
</div>
